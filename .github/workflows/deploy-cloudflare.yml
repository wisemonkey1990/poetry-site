name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Used only to decide below whether the Worker secrets can be uploaded.
      HAS_CORRECTION_SECRETS: ${{ secrets.CORRECTION_GITHUB_TOKEN != '' && secrets.TURNSTILE_SECRET_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: https://poetry.lightos.wiki
          # Turnstile Site Key 是公开值（每位访客都能在页面源码里看到），不是机密；
          # 仓库变量 VITE_TURNSTILE_SITE_KEY 若已设置则优先使用，否则用下面的默认值。
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || '0x4AAAAAAGTTbB40vsutgYuo' }}
        run: npm run build
      # Two mutually exclusive deploy steps: wrangler-action fails if a name in
      # `secrets:` has an empty env value, so the secrets variant only runs when
      # both GitHub secrets exist. Without them the site still deploys and
      # /api/correction answers 503 until the secrets are added and deploy re-run.
      - name: Deploy to Cloudflare Workers (with correction secrets)
        if: env.HAS_CORRECTION_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        env:
          CORRECTION_GITHUB_TOKEN: ${{ secrets.CORRECTION_GITHUB_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
          secrets: |
            CORRECTION_GITHUB_TOKEN
            TURNSTILE_SECRET_KEY
      - name: Deploy to Cloudflare Workers
        if: env.HAS_CORRECTION_SECRETS != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
